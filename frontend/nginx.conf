server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    location /auth       { proxy_pass http://user-service:8081; }
    location /api/users  { proxy_pass http://user-service:8081; }

    location ~ ^/(api/(bookings|sessions|horses|horseAssignments|instructors|comments)|uploads) {
        proxy_pass http://booking-service:8082;
    }

    location ~ ^/api/(tournaments|tickets|seats) {
        proxy_pass http://tournament-service:8083;
    }

    # SSE notifications need buffering off and a long timeout.
    location ~ ^/api/(notifications|audit-logs) {
        proxy_pass http://notification-service:8084;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # React Router: unknown paths load index.html.
    location / {
        try_files $uri /index.html;
    }
}