services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"


  user-service:
      image: ${DOCKERHUB_USER}/equestrian-user-service:${TAG:-latest}
      build:
        context: .
        args:
          SERVICE: user-service
      container_name: user-service
      ports:
        - "8081:8081"
      environment: &common-env
        DB_URL: ${DB_URL}
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        KAFKA_SERVERS: kafka:29092
        MAIL_USERNAME: ${MAIL_USERNAME}
        MAIL_PASSWORD: ${MAIL_PASSWORD}
      volumes:
        - uploads:/app/uploads
      depends_on:
        kafka:
          condition: service_started

  booking-service:
      image: ${DOCKERHUB_USER}/equestrian-booking-service:${TAG:-latest}
      build:
        context: .
        args:
          SERVICE: booking-service
      container_name: booking-service
      ports:
        - "8082:8082"
      environment:
        <<: *common-env
        USER_SERVICE_URL: http://user-service:8081
      volumes:
        - uploads:/app/uploads
      depends_on:
        kafka:
          condition: service_started
        user-service:
          condition: service_started

  tournament-service:
      image: ${DOCKERHUB_USER}/equestrian-tournament-service:${TAG:-latest}
      build:
        context: .
        args:
          SERVICE: tournament-service
      container_name: tournament-service
      ports:
        - "8083:8083"
      environment: *common-env
      depends_on:
        kafka:
          condition: service_started

  notification-service:
      image: ${DOCKERHUB_USER}/equestrian-notification-service:${TAG:-latest}
      build:
        context: .
        args:
          SERVICE: notification-service
      container_name: notification-service
      ports:
        - "8084:8084"
      environment: *common-env
      depends_on:
        kafka:
          condition: service_started
volumes:
  uploads: