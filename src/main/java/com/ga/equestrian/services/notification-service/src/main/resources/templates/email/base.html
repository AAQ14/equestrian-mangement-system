<!DOCTYPE html>
<!--
  Shared layout for every email of the Equestrian Centre.
  EmailService replaces the {{placeholders}} before sending.
  Email apps ignore most modern CSS, so the layout uses tables and inline styles on purpose.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f8f7f5;">
<!-- Preheader: the grey preview line shown next to the subject in the inbox. -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{preheader}}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8f7f5;">
    <tr>
        <td align="center" style="padding:32px 12px;">

            <!-- Card, max 600px wide (the standard width for emails). -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:600px; background-color:#ffffff; border:1px solid #e6e2dc;">

                <!-- Header: slim logo bar. -->
                <tr>
                    <td align="center" style="padding:22px 24px; border-bottom:1px solid #e6e2dc;">
              <span style="display:inline-block; width:34px; height:34px; line-height:34px; border:1px solid #1b1b1b; border-radius:50%;
                           font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:17px; color:#1b1b1b; text-align:center;
                           vertical-align:middle;">E</span>
                        <span style="display:inline-block; margin-left:10px; vertical-align:middle; font-family:Georgia, 'Times New Roman', serif;
                           font-size:18px; letter-spacing:4px; color:#1b1b1b;">Equestrian Center</span>
                    </td>
                </tr>

                <!-- Photo banner. A normal <img> is used (not a CSS background), because every email app shows it. -->
                <tr>
                    <td style="padding:0; line-height:0; font-size:0;">
                        <img src="{{imageUrl}}" width="600" alt="{{imageAlt}}"
                             style="display:block; width:100%; max-width:600px; height:auto; border:0; background-color:#3a3a3a;">
                    </td>
                </tr>

                <!-- Body. -->
                <tr>
                    <td style="padding:40px 40px 16px 40px; font-family:Arial, Helvetica, sans-serif; color:#5c5c5c;">
                        <div style="font-size:11px; letter-spacing:3px; text-transform:uppercase; color:#8e8e8e;">{{eyebrow}}</div>
                        <h1 style="margin:10px 0 24px 0; font-family:Georgia, 'Times New Roman', serif; font-weight:normal;
                         font-size:28px; line-height:1.25; color:#1b1b1b; text-transform:uppercase; letter-spacing:1px;">
                            {{title}}
                        </h1>
                        <p style="margin:0 0 16px 0; font-size:15px; line-height:1.7;">Hello {{firstName}},</p>
                        {{content}}
                    </td>
                </tr>

                <!-- Button (empty when the email has no link). -->
                <tr>
                    <td align="center" style="padding:8px 40px 40px 40px;">
                        {{button}}
                    </td>
                </tr>

                <!-- Footer. -->
                <tr>
                    <td style="border-top:1px solid #e6e2dc; padding:24px 40px; font-family:Arial, Helvetica, sans-serif;
                       font-size:12px; line-height:1.6; color:#8e8e8e; text-align:center;">
              <span style="font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:14px; color:#5c5c5c;">
                “No hour of life is wasted that is spent in the saddle.”
              </span><br><br>
                        You received this email because you have an account at Equestrian Center.<br>
                        &copy; {{year}} Equestrian Center
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
